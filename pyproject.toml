[project]
name = "notifier"
version = "0.1.0"
description = "An MCP server that sends notifications to users."
readme = "README.md"
authors = [
    { name = "valiantlynx", email = "valiantlynx@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.13.0.2",
    "plyer>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
